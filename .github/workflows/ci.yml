# MCP supervisor build + unit-test gate. Triggered on every PR targeting main,
# and on demand via workflow_dispatch. Integration tests under tests/integration/
# require a live llama-server backend and are excluded by the supervisor's
# `npm test` script (see package.json:scripts.test).
#
# There is no push trigger: PRs are the gate, and a merge push would re-run the
# identical suite on a tree already proven green by its PR's checks. Superseded
# runs on the same ref are cancelled (concurrency below).
#
# Bead: qwen-coprocessor-stack-rg6. Motivated by the gbi poll-cursor
# regression — a numeric/lexicographic boundary bug that the test suite
# already had hooks to catch, but no automated gate ever ran the suite
# on a PR.

name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervisor:
    name: supervisor build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-bridges/qwen-agent-server
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-bridges/qwen-agent-server/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck + build
        run: npm run build

      # Type-check the test sources too (unit + integration): the build tsconfig
      # scopes rootDir to src/ and excludes tests/, and vitest runs via esbuild
      # (strips types), so compile-only assertions in tests/*.test.ts were never
      # type-checked (beads ahd + h7v). This gate catches an invalid test literal
      # (e.g. a BackendInfo missing a required field) or SDK message-shape drift
      # instead of passing silently.
      - name: typecheck test sources
        run: npm run typecheck:tests

      - name: unit tests
        run: npm test

      # Integration tests skip gracefully when llama-server isn't
      # reachable on :8080 (see backendAvailable guard in
      # tests/integration/*). Pin 4 of sdk-behavior (the wrapper
      # bridge) runs unconditionally — that's the load-bearing CI
      # signal here: it catches regressions in QueryOptions.env
      # threading and pathToQwenExecutable handling that the unit
      # mock can't model. (Bead 1m4.)
      - name: integration tests (wrapper bridge always runs, llama tests skip)
        run: npm run test:integration
