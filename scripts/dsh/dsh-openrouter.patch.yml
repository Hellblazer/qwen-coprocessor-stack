# Overlay for `dsh --profile headless`: send the agent through dsh-pin-proxy.py (OpenRouter
# provider pin, auth, usage log) to OpenRouter's Anthropic-format endpoint. DSH_PROXY_BASE,
# DSH_PROXY_DUMMY_KEY (a placeholder; the proxy adds the real key) and DSH_MODEL come from the
# process env (dsh-run.sh). No secret lives here or in dsh's environment.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      ds-or:
        displayName: DeepSeek via OpenRouter
        api: anthropic-messages
        baseURL: !!js process.env.DSH_PROXY_BASE
        apiKeyEnv: DSH_PROXY_DUMMY_KEY
        models:
          - id: !!js process.env.DSH_MODEL
            name: !!js process.env.DSH_MODEL
            contextWindow: 1048576
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: ds-or
    model: !!js process.env.DSH_MODEL
